spring.application.name=ai-service

server.port=${SERVER_PORT:8084}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://qlda-postgres:5432/QLDA}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://service-registry:8761/eureka}

# Gemini - chatbot vẫn sử dụng local fallback nếu key thiếu, sai hoặc hết quota.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
gemini.api.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.api.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:3000}
gemini.api.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:12000}
gemini.api.max-concurrent-requests=${GEMINI_MAX_CONCURRENT_REQUESTS:1}
gemini.api.max-wait-for-permit-ms=${GEMINI_MAX_WAIT_FOR_PERMIT_MS:3000}
gemini.api.max-retries=${GEMINI_MAX_RETRIES:1}
gemini.api.initial-backoff-ms=${GEMINI_INITIAL_BACKOFF_MS:750}
gemini.api.max-backoff-ms=${GEMINI_MAX_BACKOFF_MS:3000}

# Internal services. Dùng key Spring khác tên biến môi trường để tránh circular placeholder.
services.document.base-url=${DOCUMENT_SERVICE_BASE_URL:http://document-service:8082}
services.workflow.base-url=${WORKFLOW_SERVICE_BASE_URL:http://workflow-service:8083}
services.auth.base-url=${AUTH_SERVICE_BASE_URL:http://auth-service:8081}
internal.auth.service-token=${INTERNAL_SERVICE_TOKEN:change-me-in-dev}
internal.auth.service-name=${SERVICE_NAME:ai-service}
internal.auth.allowed-services=${INTERNAL_ALLOWED_SERVICES:document-service,workflow-service,auth-service,notification-service}

# Chatbot
chatbot.top-k=${CHATBOT_TOP_K:5}
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:20}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Shared upload volume used for OCR of document attachments
ai.upload-root=${AI_UPLOAD_ROOT:/app/uploads}
