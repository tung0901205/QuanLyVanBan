spring:
  application:
    name: api-gateway

  cloud:
    compatibility-verifier:
      enabled: false

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: ai-service-actuator
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/health
              filters:
                - RewritePath=/api/ai/health, /actuator/health

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**

            - id: document-service
              uri: lb://document-service
              predicates:
                - Path=/api/documents/**

            - id: workflow-service
              uri: lb://workflow-service
              predicates:
                - Path=/api/workflows/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**,/api/audit-logs/**,/api/reports/**

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true