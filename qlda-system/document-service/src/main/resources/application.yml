spring:
  application:
    name: document-service

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:110MB}

  datasource:
    url: ${DB_URL:jdbc:postgresql://qlda-postgres:5432/QLDA}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:qlda-kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  cloud:
    compatibility-verifier:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://service-registry:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  max-file-size-bytes: ${MAX_UPLOAD_FILE_SIZE_BYTES:104857600}
  allowed-file-extensions: ${ALLOWED_UPLOAD_EXTENSIONS:pdf,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,txt,csv,xml,png,jpg,jpeg,tif,tiff}
  kafka:
    notification-topic: ${NOTIFICATION_EVENTS_TOPIC:notification-events}

services:
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  workflow-service:
    base-url: ${WORKFLOW_SERVICE_URL:http://workflow-service:8083}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://ai-service:8084}

office365:
  tenant-id: ${OFFICE365_TENANT_ID:}
  client-id: ${OFFICE365_CLIENT_ID:}
  client-secret: ${OFFICE365_CLIENT_SECRET:}
  sharepoint:
    enabled: ${SHAREPOINT_ENABLED:false}
    site-id: ${SHAREPOINT_SITE_ID:}
    upload-path: ${SHAREPOINT_UPLOAD_PATH:eOIS/VanBan}

internal:
  auth:
    service-name: ${INTERNAL_SERVICE_NAME:document-service}
    service-token: ${INTERNAL_SERVICE_TOKEN:change-me-in-dev}
    allowed-services:
      - workflow-service
      - ai-service
      - report-service
      - support-service
      - notification-service
