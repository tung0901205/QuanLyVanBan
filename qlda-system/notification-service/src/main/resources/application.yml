spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://qlda-postgres:5432/QLDA}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:qlda-kafka:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  cloud:
    compatibility-verifier:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

  mail:
    host: ${OUTLOOK_SMTP_HOST:smtp-mail.outlook.com}
    port: ${OUTLOOK_SMTP_PORT:587}
    username: ${OUTLOOK_SMTP_USERNAME:}
    password: ${OUTLOOK_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${SERVER_PORT:8085}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://service-registry:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  report-export-dir: ${APP_REPORT_EXPORT_DIR:exports}

  notification:
    email:
      from: ${OUTLOOK_SMTP_FROM:${OUTLOOK_SMTP_USERNAME:}}
    teams:
      webhook-url: ${TEAMS_WEBHOOK_URL:}

  kafka:
    notification-topic: ${NOTIFICATION_EVENTS_TOPIC:notification-events}
    notification-dlq-topic: ${NOTIFICATION_EVENTS_DLQ_TOPIC:notification-events-dlq}

services:
  document-service:
    base-url: ${DOCUMENT_SERVICE_URL:http://document-service:8082}

  workflow-service:
    base-url: ${WORKFLOW_SERVICE_URL:http://workflow-service:8083}

  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}

internal:
  auth:
    service-name: notification-service
    service-token: ${INTERNAL_SERVICE_TOKEN:change-me-in-dev}
